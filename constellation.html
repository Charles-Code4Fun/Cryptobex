const MAX_EDGES = 1500;

// 状态显示
function setStatus(msg) {
    const box = document.getElementById("statusBox");
    if (box) box.innerHTML = msg;
}

// 隐藏加载条
function hideLoadingBar() {
    const loadingBar = document.getElementById("loadingBar");
    if (loadingBar) loadingBar.style.display = "none";

    const bar = document.getElementById("bar");
    if (bar) bar.style.width = "100%";

    const text = document.getElementById("text");
    if (text) text.innerHTML = "100%";
}

// 颜色映射（蓝 -> 红）
function degreeToColor(degree, minDegree, maxDegree) {
    let ratio = (degree - minDegree) / ((maxDegree - minDegree) || 1);

    let r = Math.round(255 * ratio);
    let g = 100;
    let b = Math.round(255 * (1 - ratio));

    return `rgb(${r},${g},${b})`;
}

// 重建图（增强视觉版）
function rebuildGraph(filteredEdges) {
    setStatus("Rebuilding graph...");

    if (!filteredEdges || filteredEdges.length === 0) {
        network.setData({
            nodes: new vis.DataSet([]),
            edges: new vis.DataSet([])
        });
        hideLoadingBar();
        setStatus("No data in selected range.");
        return;
    }

    if (filteredEdges.length > MAX_EDGES) {
        filteredEdges = filteredEdges.slice(0, MAX_EDGES);
        setStatus("Too many edges. Showing first " + MAX_EDGES + " edges only.");
    }

    // ===== 统计节点 degree =====
    let degreeCounts = {};
    filteredEdges.forEach(edge => {
        degreeCounts[edge.source] = (degreeCounts[edge.source] || 0) + 1;
        degreeCounts[edge.target] = (degreeCounts[edge.target] || 0) + 1;
    });

    const minDegreeInput = parseInt(document.getElementById("minDegree").value || "1");

    // ===== 过滤节点 =====
    let validNodes = new Set();
    Object.keys(degreeCounts).forEach(node => {
        if (degreeCounts[node] >= minDegreeInput || node === 'world') {
            validNodes.add(node);
        }
    });

    filteredEdges = filteredEdges.filter(edge =>
        validNodes.has(edge.source) && validNodes.has(edge.target)
    );

    if (filteredEdges.length === 0) {
        network.setData({
            nodes: new vis.DataSet([]),
            edges: new vis.DataSet([])
        });
        hideLoadingBar();
        setStatus("No edges after min degree filter.");
        return;
    }

    // ===== 聚合边权重 =====
    let edgeMap = {};
    filteredEdges.forEach(edge => {
        const key = edge.source + "||" + edge.target;
        if (!edgeMap[key]) {
            edgeMap[key] = {
                source: edge.source,
                target: edge.target,
                weight: 0
            };
        }
        edgeMap[key].weight += 1;
    });

    const aggregatedEdges = Object.values(edgeMap);

    // ===== 重新统计 degree（按聚合后图）=====
    let finalDegreeCounts = {};
    aggregatedEdges.forEach(edge => {
        finalDegreeCounts[edge.source] = (finalDegreeCounts[edge.source] || 0) + edge.weight;
        finalDegreeCounts[edge.target] = (finalDegreeCounts[edge.target] || 0) + edge.weight;
    });

    let nodeSet = new Set();
    aggregatedEdges.forEach(edge => {
        nodeSet.add(edge.source);
        nodeSet.add(edge.target);
    });

    let degrees = Object.values(finalDegreeCounts);
    let maxDegree = Math.max(...degrees, 1);
    let minDegree = Math.min(...degrees, 1);

    let maxWeight = Math.max(...aggregatedEdges.map(e => e.weight), 1);

    let nodes = [];
    let edges = [];

    // ===== 节点 =====
    nodeSet.forEach(node => {
        let degree = finalDegreeCounts[node] || 1;
        let color = node === 'world' ? '#ff3b3b' : degreeToColor(degree, minDegree, maxDegree);
        let size = node === 'world' ? 38 : 12 + Math.min(degree * 1.8, 30);
        let borderWidth = node === 'world' ? 3 : 1;

        nodes.push({
            id: node,
            label: node,
            shape: "dot",
            size: size,
            borderWidth: borderWidth,
            color: {
                background: color,
                border: "#2b2b2b",
                highlight: {
                    background: color,
                    border: "#000000"
                },
                hover: {
                    background: color,
                    border: "#000000"
                }
            },
            font: {
                size: 18,
                face: "Arial",
                strokeWidth: 2,
                strokeColor: "#ffffff"
            },
            title: "<b>" + node + "</b><br>Connections: " + degree
        });
    });

    // ===== 边 =====
    aggregatedEdges.forEach(edge => {
        let width = 1 + (edge.weight / maxWeight) * 7;
        let alpha = 0.18 + (edge.weight / maxWeight) * 0.75;
        let edgeColor = `rgba(80,80,80,${alpha.toFixed(2)})`;

        edges.push({
            from: edge.source,
            to: edge.target,
            width: width,
            value: edge.weight,
            arrows: "to",
            color: {
                color: edgeColor,
                highlight: "rgba(255,80,80,0.9)",
                hover: "rgba(255,80,80,1)"
            },
            title: "Weight: " + edge.weight,
            smooth: {
                type: "dynamic"
            }
        });
    });

    // ===== 更新图 =====
    network.setData({
        nodes: new vis.DataSet(nodes),
        edges: new vis.DataSet(edges)
    });

    // ===== 轻量适配视图 =====
    setTimeout(() => {
        hideLoadingBar();
        network.fit({ animation: true });
    }, 250);

    setStatus(
        "Nodes: " + nodes.length +
        " | Edges: " + edges.length +
        " | Min Degree: " + minDegreeInput
    );
}

// Apply
function applyDateFilter() {
    setStatus("Filtering...");

    const start = document.getElementById("startDate").value;
    const end   = document.getElementById("endDate").value;

    setTimeout(() => {
        let filtered = allEdgesRaw.filter(edge => {
            if (!start && !end) return true;
            if (start && edge.published < start) return false;
            if (end && edge.published > end) return false;
            return true;
        });

        rebuildGraph(filtered);
    }, 50);
}

// Reset
function resetDateFilter() {
    document.getElementById("startDate").value = "";
    document.getElementById("endDate").value = "";
    document.getElementById("minDegree").value = "1";
    rebuildGraph(allEdgesRaw);
}

// 页面初始状态
setTimeout(() => {
    hideLoadingBar();
    setStatus("Ready | Total raw edges: " + allEdgesRaw.length);
}, 500);

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cybex ProPort</title>
<style>
body {
    font-family: Arial, sans-serif;
    background:#0e1117;
    color:#e6e6e6;
    margin:20px;
    text-align:center; /* 整体居中 */
}

/* ===== Header Container: 垂直排列 ===== */
.header-container{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:15px; /* logo、标题、按钮间距 */
    margin-bottom:30px;
    max-width:600px;
    margin-left:auto;
    margin-right:auto;
}

/* Logo */
.logo{
    height:120px; /* 增大 logo */
    width:auto;
    margin-bottom:5px;
    border-radius:8px; /* 可选圆角 */
}

/* 标题 */
.header-title{
    font-size:2.4rem;
    font-weight:700;
    margin:0;
}

/* 按钮组 */
.top-bar{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center; /* 居中显示 */
    margin-top:10px;
}

button{
    background: linear-gradient(135deg,#00ff9c,#00c3ff);
    border:none;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    font-size:1rem;
    transition: transform 0.2s, opacity 0.2s;
}

button:hover{
    opacity:0.85;
    transform: scale(1.05);
}

/* ===== Section 样式保持不变 ===== */
.section{
    margin:30px auto;
    background:#121722;
    padding:20px;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,255,156,0.05);
    max-width:1000px;
}

.header-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.link-btn{
    background:#1c1f26;
    color:#00ff9c;
    padding:6px 12px;
    border-radius:6px;
    text-decoration:none;
}
.link-btn:hover{
    background:#00ff9c;
    color:#000;
}

/* Insight Box */
.insight-box{
    margin-top:10px;
    background:#161a22;
    padding:12px;
    border-radius:8px;
    border-left:3px solid #00ff9c;
}

/* Tabs */
.tabs{
    margin-top:15px;
}
.tab-btn{
    margin-right:8px;
    padding:6px 12px;
    cursor:pointer;
    border-radius:6px;
    background:#1c1f26;
}
.tab-btn.active{
    background:#00ff9c;
    color:#000;
}

/* Table 样式保持不变 */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}
th,td{
    padding:8px;
    text-align:center;
    border-bottom:1px solid #2a2f3a;
}
th{background:#1f2430;}
tr:hover{
    background:#1c2230;
    cursor:pointer;
}

/* Colors & Badge */
.green{color:#00ff9c;}
.yellow{color:#ffd166;}
.red{color:#ff5c5c;}
.badge{padding:3px 6px;border-radius:6px;font-size:11px;}
.low{background:#00ff9c;color:#000;}
.med{background:#ffd166;color:#000;}
.high{background:#ff5c5c;color:#000;}

/* 搜索框 */
.search{
    margin-top:10px;
    padding:6px;
    width:200px;
    background:#1c1f26;
    border:none;
    color:#fff;
}

/* ===== Responsive ===== */
@media(max-width:600px){
    .logo{height:100px;}
    .header-title{font-size:2rem;}
    .top-bar{gap:8px;}
}
</style>
</head>

<body>

<!-- ===== Header: Logo 上方 居中排列 ===== -->
<div class="header-container">
    <img src="logo.png" alt="Logo" class="logo">
    <h1 class="header-title">Cybex Pro Dashboard</h1>
    <div class="top-bar">
        <button onclick="exportPortfolio()">Export</button>
        <button onclick="window.location.href='news.html'">Catalyst</button>
        <button onclick="confirmConstellation()">Constellation</button>
    </div>
</div>

<!-- ===== CRYPTO Section ===== -->
<div class="section">
<div class="header-row">
<h2>🪙 Crypto</h2>
<a href="coinIndex.html" class="link-btn">Explore →</a>
</div>
<input class="search" placeholder="Search Crypto..." oninput="filterTable(this,'crypto')">
<div id="cryptoInsight" class="insight-box"></div>
<div class="tabs">
<span class="tab-btn active" onclick="switchTab('crypto','top',this)">Top 5</span>
<span class="tab-btn" onclick="switchTab('crypto','gainers',this)">Top Gainers</span>
</div>
<table>
<thead>
<tr><th>#</th><th>Symbol</th><th>Perf</th><th>Return</th><th>Risk</th></tr>
</thead>
<tbody id="cryptoBody"></tbody>
</table>
</div>

<!-- ===== STOCK Section ===== -->
<div class="section">
<div class="header-row">
<h2>📈 Stocks</h2>
<a href="stockIndex.html" class="link-btn">Explore →</a>
</div>
<input class="search" placeholder="Search Stock..." oninput="filterTable(this,'stock')">
<div id="stockInsight" class="insight-box"></div>
<div class="tabs">
<span class="tab-btn active" onclick="switchTab('stock','top',this)">Top 5</span>
<span class="tab-btn" onclick="switchTab('stock','gainers',this)">Top Gainers</span>
</div>
<table>
<thead>
<tr><th>#</th><th>Symbol</th><th>Perf</th><th>Return</th><th>Risk</th></tr>
</thead>
<tbody id="stockBody"></tbody>
</table>
</div>

<!-- ===== FOREX Section ===== -->
<div class="section">
<div class="header-row">
<h2>📈 Forex</h2>
<a href="forexIndex.html" class="link-btn">Explore →</a>
</div>
<input class="search" placeholder="Search Forex..." oninput="filterTable(this,'forex')">
<div id="forexInsight" class="insight-box"></div>
<div class="tabs">
<span class="tab-btn active" onclick="switchTab('forex','top',this)">Top 5</span>
<span class="tab-btn" onclick="switchTab('forex','gainers',this)">Top Gainers</span>
</div>
<table>
<thead>
<tr><th>#</th><th>Symbol</th><th>Perf</th><th>Return</th><th>Risk</th></tr>
</thead>
<tbody id="forexBody"></tbody>
</table>
</div>




<!-- ================================================== Scripts ================================================ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
/* ===== 数据结构 ===== */
let DATA = {
    crypto:{top:[],gainers:[],current:"top"},
    stock:{top:[],gainers:[],current:"top"},
    forex:{top:[],gainers:[],current:"top"}
};

function calcRisk(sharpe){
    let vol = (1/sharpe*40).toFixed(1);
    let dd = (Math.abs(2-sharpe)*10).toFixed(1);
    let level = sharpe>2?"low":sharpe>1?"med":"high";
    return { text:`Vol:${vol}% DD:${dd}%`, cls:level };
}

function generateInsight(data,type){
    if(!data.length) return "No signal";
    let best = data[0];
    return `<b>${type} Insight</b><br>Leader: <span class="green">${best.Symbol}</span><br>High Performance + Return alignment detected<br>Suggested: Focus on top 3 allocation`;
}

function confirmConstellation() {
    if(confirm("⚠ Warning:\n\nThis feature may cause discomfort for people with trypophobia or visual sensitivity.\n\nDo you want to continue?")){
        window.location.href = 'constellation.html';
    }
}

/* ===== CSV加载 ===== */
function loadCSV(path,type){
    Papa.parse(path,{header:true,download:true,dynamicTyping:true,complete:function(res){
        let parsed = res.data.map(d=>({
            Symbol:d.Symbol,
            Sharpe:Number(d.sharpRatio)||0,
            Return:Number(d['Reference Return (%)'])||0
        }));
        DATA[type].top = parsed.filter(d=>d.Sharpe>0).sort((a,b)=>b.Sharpe-a.Sharpe).slice(0,5);
        DATA[type].gainers = parsed.sort((a,b)=>b.Return-a.Return).slice(0,5);
        render(type);
    }});
}

function render(type){
    let mode = DATA[type].current;
    let body = document.getElementById(type+"Body");
    body.innerHTML="";
    let data = DATA[type][mode];
    data.forEach((d,i)=>{
        let risk = calcRisk(d.Sharpe);
        let tr = document.createElement("tr");
        tr.onclick = ()=>{ window.location = type==="crypto"?`coinTrend.html?symbol=${d.Symbol.replace(/\//g,'_')}`:`stockTrend.html?symbol=${d.Symbol}` };
        tr.innerHTML = `<td>${i+1}</td><td>${d.Symbol}</td><td class="green">${d.Sharpe.toFixed(2)}</td><td>${d.Return.toFixed(2)}%</td><td><span class="badge ${risk.cls}">${risk.text}</span></td>`;
        body.appendChild(tr);
    });
    document.getElementById(type+"Insight").innerHTML = generateInsight(DATA[type].top,type);
}

function switchTab(type,mode,el){
    DATA[type].current=mode;
    el.parentNode.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    el.classList.add("active");
    render(type);
}

function filterTable(input,type){
    let val = input.value.toUpperCase();
    let rows = document.getElementById(type+"Body").rows;
    for(let r of rows){ r.style.display = r.innerText.toUpperCase().includes(val) ? "" : "none"; }
}

function exportPortfolio(){
    let all = [...DATA.crypto.top,...DATA.stock.top];
    let csv="Symbol,Sharpe,Return\n";
    all.forEach(d=>csv+=`${d.Symbol},${d.Sharpe},${d.Return}\n`);
    let blob=new Blob([csv]);
    let a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="portfolio_"+Date.now()+".csv";
    a.click();
}

/* ===== 初始化 ===== */
loadCSV("data/cryptos/crypto_rating_table.csv","crypto");
loadCSV("data/Stocks/stock_rating_table.csv","stock");
loadCSV("data/forex/forex_rating_table.csv","forex");

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cybex Pro Dashboard</title>

<style>
body {
    font-family: Arial;
    background:#0e1117;
    color:#e6e6e6;
    margin:20px;
}

/* ===== Header ===== */
h1{text-align:center; margin-bottom:10px;}

.top-bar{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:20px;
}

button{
    background: linear-gradient(135deg,#00ff9c,#00c3ff);
    border:none;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{opacity:0.85}

/* ===== Card Section ===== */
.section{
    margin:30px 0;
    background:#121722;
    padding:20px;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,255,156,0.05);
}

/* ===== Header ===== */
.header-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.link-btn{
    background:#1c1f26;
    color:#00ff9c;
    padding:6px 12px;
    border-radius:6px;
    text-decoration:none;
}

.link-btn:hover{
    background:#00ff9c;
    color:#000;
}

/* ===== Insight ===== */
.insight-box{
    margin-top:10px;
    background:#161a22;
    padding:12px;
    border-radius:8px;
    border-left:3px solid #00ff9c;
}

/* ===== Tabs ===== */
.tabs{
    margin-top:15px;
}
.tab-btn{
    margin-right:8px;
    padding:5px 10px;
    cursor:pointer;
    border-radius:6px;
    background:#1c1f26;
}
.tab-btn.active{
    background:#00ff9c;
    color:#000;
}

/* ===== Table ===== */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}
th,td{
    padding:8px;
    text-align:center;
    border-bottom:1px solid #2a2f3a;
}
th{background:#1f2430;}

tr:hover{
    background:#1c2230;
    cursor:pointer;
}

/* ===== Colors ===== */
.green{color:#00ff9c;}
.yellow{color:#ffd166;}
.red{color:#ff5c5c;}

.badge{
    padding:3px 6px;
    border-radius:6px;
    font-size:11px;
}
.low{background:#00ff9c;color:#000;}
.med{background:#ffd166;color:#000;}
.high{background:#ff5c5c;color:#000;}

.search{
    margin-top:10px;
    padding:6px;
    width:200px;
    background:#1c1f26;
    border:none;
    color:#fff;
}
</style>
</head>

<body>

<h1>📊 Cybex ProPort Rank</h1>

<div class="top-bar">
    <button onclick="exportPortfolio()">Export</button>
    <button onclick="window.location.href='news.html'">Catalyst</button>
</div>

<!-- ===== CRYPTO ===== -->
<div class="section">

<div class="header-row">
<h2>🪙 Crypto</h2>
<a href="coinIndex.html" class="link-btn">Explore →</a>
</div>

<input class="search" placeholder="Search Crypto..." oninput="filterTable(this,'crypto')">

<div id="cryptoInsight" class="insight-box"></div>

<div class="tabs">
<span class="tab-btn active" onclick="switchTab('crypto','top',this)">Top 5</span>
<span class="tab-btn" onclick="switchTab('crypto','gainers',this)">Top Gainers</span>
</div>

<table>
<thead>
<tr><th>#</th><th>Symbol</th><th>Perf</th><th>Return</th><th>Risk</th></tr>
</thead>
<tbody id="cryptoBody"></tbody>
</table>

</div>







<!-- ===== STOCK ===== -->
<div class="section">

<div class="header-row">
<h2>📈 Stocks</h2>
<a href="stockIndex.html" class="link-btn">Explore →</a>
</div>

<input class="search" placeholder="Search Stock..." oninput="filterTable(this,'stock')">

<div id="stockInsight" class="insight-box"></div>

<div class="tabs">
<span class="tab-btn active" onclick="switchTab('stock','top',this)">Top 5</span>
<span class="tab-btn" onclick="switchTab('stock','gainers',this)">Top Gainers</span>
</div>

<table>
<thead>
<tr><th>#</th><th>Symbol</th><th>Perf</th><th>Return</th><th>Risk</th></tr>
</thead>
<tbody id="stockBody"></tbody>
</table>

</div>


<!-- =================================================== 添加显示FOREX数据=========================================================== -->
<!-- ===== FOREX ===== -->
<div class="section">

<div class="header-row">
<h2>📈 Forex</h2>
<a href="forexIndex.html" class="link-btn">Explore →</a>
</div>

<input class="search" placeholder="Search Forex..." oninput="filterTable(this,'forex')">

<div id="forexInsight" class="insight-box"></div>

<div class="tabs">
<span class="tab-btn active" onclick="switchTab('forex','top',this)">Top 5</span>
<span class="tab-btn" onclick="switchTab('forex','gainers',this)">Top Gainers</span>
</div>

<table>
<thead>
<tr><th>#</th><th>Symbol</th><th>Perf</th><th>Return</th><th>Risk</th></tr>
</thead>
<tbody id="forexBody"></tbody>
</table>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>



/* =================================================== 添加数据=========================================================== */
let DATA = {
    crypto:{top:[],gainers:[],current:"top"},
    stock:{top:[],gainers:[],current:"top"},
    forex:{top:[],gainers:[],current:"top"}   // ✅ 加这一行
};

/* ===== 风险模型（稳定版） ===== */
function calcRisk(sharpe){
    let vol = (1/sharpe*40).toFixed(1);
    let dd = (Math.abs(2-sharpe)*10).toFixed(1);

    let level = sharpe>2?"low":sharpe>1?"med":"high";

    return {
        text:`Vol:${vol}% DD:${dd}%`,
        cls:level
    };
}

/* ===== Insight ===== */
function generateInsight(data,type){
    if(!data.length) return "No signal";

    let best = data[0];

    return `
    <b>${type} Insight</b><br>
    Leader: <span class="green">${best.Symbol}</span><br>
    High Performance + Return alignment detected<br>
    Suggested: Focus on top 3 allocation
    `;
}

/* ===== 加载 ===== */
function loadCSV(path,type){
    Papa.parse(path,{
        header:true,
        download:true,
        dynamicTyping:true,
        complete:function(res){

            let parsed = res.data.map(d=>({
                Symbol:d.Symbol,
                Sharpe:Number(d.sharpRatio)||0,
                Return:Number(d['Reference Return (%)'])||0
            }));

            DATA[type].top = parsed
                .filter(d=>d.Sharpe>0)
                .sort((a,b)=>b.Sharpe-a.Sharpe)
                .slice(0,5);

            DATA[type].gainers = parsed
                .sort((a,b)=>b.Return-a.Return)
                .slice(0,5);

            render(type);
        }
    });
}

/* ===== 渲染 ===== */
function render(type){
    let mode = DATA[type].current;
    let body = document.getElementById(type+"Body");
    body.innerHTML="";

    let data = DATA[type][mode];

    data.forEach((d,i)=>{
        let risk = calcRisk(d.Sharpe);

        let tr = document.createElement("tr");

        tr.onclick = ()=>{
            window.location = type==="crypto"
                ? `coinTrend.html?symbol=${d.Symbol.replace(/\//g, '_')}`
                : `stockTrend.html?symbol=${d.Symbol}`;
        };

        tr.innerHTML = `
        <td>${i+1}</td>
        <td>${d.Symbol}</td>
        <td class="green">${d.Sharpe.toFixed(2)}</td>
        <td>${d.Return.toFixed(2)}%</td>
        <td><span class="badge ${risk.cls}">${risk.text}</span></td>
        `;

        body.appendChild(tr);
    });

    document.getElementById(type+"Insight").innerHTML =
        generateInsight(DATA[type].top,type);
}

/* ===== Tab ===== */
function switchTab(type,mode,el){
    DATA[type].current=mode;
    document.querySelectorAll(`#${type}Body`).forEach(()=>{});
    el.parentNode.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    el.classList.add("active");
    render(type);
}

/* ===== 搜索 ===== */
function filterTable(input,type){
    let val = input.value.toUpperCase();
    let rows = document.getElementById(type+"Body").rows;

    for(let r of rows){
        r.style.display = r.innerText.toUpperCase().includes(val) ? "" : "none";
    }
}

/* ===== 导出 ===== */
function exportPortfolio(){
    let all = [...DATA.crypto.top,...DATA.stock.top];
    let csv="Symbol,Sharpe,Return\n";
    all.forEach(d=>csv+=`${d.Symbol},${d.Sharpe},${d.Return}\n`);

    let blob=new Blob([csv]);
    let a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="portfolio_"+Date.now()+".csv";
    a.click();
}

/* ===== 刷新 ===== */
function reload(){
    location.reload();
}



/* =================================================== 添加数据初始化=========================================================== */
loadCSV("data/cryptos/crypto_rating_table.csv","crypto");
loadCSV("data/Stocks/stock_rating_table.csv","stock");
loadCSV("data/Forex/forex_rating_table.csv","forex");


</script>

</body>
</html>
